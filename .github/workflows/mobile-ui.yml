name: mobile-ui

on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ui.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ui.yml'

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck and verify local UI assets
        run: npm run typecheck && npm run check:ui-assets
        working-directory: apps/mobile
      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
      - name: Check offline screen flows and geometry
        run: npm run test:ui
        working-directory: apps/mobile
      - name: Upload screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-screens
          path: apps/mobile/dist/screenshots
