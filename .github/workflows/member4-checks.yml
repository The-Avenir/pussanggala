# T01 member-4 gates (typecheck, tests, shipped-content allowlist check).
#
# Owner: Member 4. No secrets, no network in the check steps themselves
# (`npm install` uses the registry to fetch pinned deps; the checks below it
# only read local files and run local tests).

name: member4-checks

on:
  push:
  pull_request:

jobs:
  member4-checks:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run workspace tests
        run: npm test

      - name: Check corpus and pack-builder handoff
        run: |
          node tools/corpus/extract.mjs
          node --test tools/corpus/*.test.mjs tools/pack-builder/*.test.mjs

      - name: Check persistence types and builder-compatible asset loader
        run: |
          node apps/mobile/src/store/check.mjs
          node node_modules/typescript/bin/tsc -p tools/eval/t41-assets/tsconfig.json
          node node_modules/vitest/vitest.mjs run --config tools/eval/t41-assets/vitest.config.mts

      - name: Check Expo dependency and plugin configuration
        run: npm run mobile:check

      - name: Generate and inspect local Android project
        run: |
          npm run android:prebuild
          node apps/mobile/scripts/verify-native.cjs

      - name: Bundle the Android harness and shared workspace source
        run: npm run export:android --workspace @pusang-gala/mobile

      - name: Shipped-content allowlist check (INV-4)
        run: node tools/eval/allowlist-check.mjs

      - name: Allowlist-check fixtures (positive + negative)
        run: node --test tools/eval/allowlist-check.test.mjs
